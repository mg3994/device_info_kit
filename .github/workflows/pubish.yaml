name: Publish DartNative Plugin

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install DartNative CLI
        run: |
          curl -fsSL https://cdn.dartnative.com/install.sh | sh
          echo "$HOME/zero/bin" >> "$GITHUB_PATH"

      - name: Verify DartNative CLI
        run: dn --version

      - name: Precache DartNative SDK artifacts
        run: dn precache --force --universal

      - name: Resolve dependencies
        run: dn pub get

      - name: Publish to dartpub.dev
        env:
          DN_PUBLISH_TOKEN: ${{ secrets.DN_PUBLISH_TOKEN }}
        run: dn publish --token "$DN_PUBLISH_TOKEN"